# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    HYPRLAND KEYBINDS - ОРГАНІЗОВАНИЙ КОНФІГ               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► СИСТЕМА
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Перезавантаження Hyprland
bind = CTRL+SUPER+SHIFT, R, exec, ~/.config/hypr/scripts/restart-hyprland.sh

# Блокування екрану
bind = Super, L, exec, hyprlock

# Вихід з сесії
bind = Super, M, exec, ~/.config/rofi/powermenu/type-2/powermenu.sh
bindl = CTRL+SUPER+SHIFT, L, exec, sleep 0.1 && systemctl suspend
bind = CTRL+SHIFT+Alt, Delete, exec, systemctl poweroff


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ЖИВЛЕННЯ ТА ПРОФІЛІ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Переключення профілів живлення
bindle = CTRL+SHIFT, P, exec, ~/.config/hypr/scripts/power-profiles.sh

# Показ поточного профілю
bindle = CTRL+SHIFT, G, exec, notify-send --hint=string:x-dunst-stack-tag:power-profile --hint=string:synchronous:power-profile --expire-time=1000 -u normal "Профіль живлення" "$(powerprofilesctl get)"


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► АУДІО
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Мute/Unmute динаміків та мікрофону
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/toggle-audio-mute.sh
bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/toggle-mic-mute.sh

# Гучність звуку (звичайне - 2%, Shift - 5%, Ctrl - 0/100%)
bindle = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-notify.sh up
bindle = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-notify.sh down

bindle = Shift, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle = Shift, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0

# Плеєр (ПКМ на трейі)
bind = , mouse:274, exec, playerctl play-pause

# Відкрити EasyEffects
bind = CTRL+Super, V, exec, easyeffects


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ЯСКРАВІСТЬ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Яскравість (звичайне - 5%, Shift - 0/100%)
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = SHIFT, XF86MonBrightnessUp, exec, brightnessctl set 100%
bind = SHIFT, XF86MonBrightnessDown, exec, brightnessctl set 0%

# Гама-корекція / Блакитне світло (Hyprsunset)
bindle = CTRL, XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10
bindle = CTRL, XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10

bind = Super, f7, exec, hyprctl hyprsunset gamma 0
bind = Super, f8, exec, hyprctl hyprsunset gamma 100


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► СКРІНШОТИ ТА УТИЛІТИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Скріншот обраної площі (редагування в Swappy + копія в буфер)
bind = Super, S, exec, bash -lc 'dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; f="$dir/area_$(date +%F_%H-%M-%S).png"; grim -g "$(slurp $SLURP_ARGS)" - | tee "$f" >(wl-copy) | swappy -f -'

# Скріншот всього екрану (в буфер)
bindl = , Print, exec, grim - | wl-copy

# Скріншот всього екрану (файл + буфер)
bind = Shift, Print, exec, dir="$HOME/Pictures/Screenshots"; mkdir -p "$dir"; f="$dir/$(date +'%F_%H-%M-%S').png"; grim - | tee "$f" | wl-copy

# Піпетка (колір)
bind = SUPER+CTRL, C, exec, hyprpicker -a

# OCR англійської мови
bind = CTRL+SUPER+SHIFT, E, exec, tmp="$(mktemp --suffix .png)" && grim -g "$(slurp $SLURP_ARGS)" "$tmp" && tesseract "$tmp" - -l eng | wl-copy && rm -f "$tmp"

# OCR української мови
bind = CTRL+SUPER+SHIFT, U, exec, tmp="$(mktemp --suffix .png)" && grim -g "$(slurp $SLURP_ARGS)" "$tmp" && tesseract "$tmp" - -l ukr | wl-copy && rm -f "$tmp"

# Історія буфера обміну
bind = ALT, V, exec, cliphist list -n | rofi -dmenu | cliphist decode | wl-copy

# Емодзі
bind = Super, Period, exec, rofi -modi "emoji:rofimoji" -show emoji


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ЗАПУСК ДОДАТКІВ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Rofi лаунчер
bind = ALT, SPACE, exec, ~/.config/rofi/launchers/type-6/launcher.sh

# Терміналь
bind = Super, T, exec, kitty

# Монітор ресурсів
bind = CTRL+SHIFT, Escape, exec, kitty -e btop

# Файловий менеджер
bind = Super, E, exec, nemo
bind = SUPER+Shift, E, exec, nemo --name nemo-float

# IDE та спеціалізовані додатки
bind = Super Shift, C, exec, gtk-launch jetbrains-clion
bind = Super Shift, P, exec, gtk-launch jetbrains-pycharm
bind = Super Shift, R, exec, gtk-launch jetbrains-rider

# Комунікація та розваги
bind = SUPER+Shift, T, exec, Telegram
bind = SUPER+Shift, D, exec, discord

# Заходи
bind = Super, O, exec, obsidian
bind = Super, B, exec, blueman-manager
bind = SUPER+SHIFT, V, exec, virt-manager


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВІКНА - УПРАВЛІННЯ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Закриття вікна
bind = Super, X, killactive
bind = SUPER+SHIFT+Alt, Q, exec, hyprctl kill

# Мова (moving) та зміна розміру мишею
bindm = Super, mouse:272, movewindow
bindm = Super+Ctrl, mouse:272, resizewindow
bindm = Super, mouse:273, resizewindow

# Режими вікон
bind = Super, F, togglefloating
bind = Super, D, fullscreenstate, 2 2

# Закріпити вікно на всіх воркспейсах
bind = SUPER, P, pin


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВІКНА - РОЗМІР (КЛАВІШАМИ)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

binde = SUPER+Alt, Left,  resizeactive, -20 0
binde = SUPER+Alt, Right, resizeactive,  20 0
binde = SUPER+Alt, Up,    resizeactive,   0 -20
binde = SUPER+Alt, Down,  resizeactive,   0  20


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► MASTER LAYOUT (ВОРКСПЕЙС 1)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Циклювання вікон у стеку
bind = SUPER+SHIFT, J, layoutmsg, cyclenext
bind = SUPER+SHIFT, K, layoutmsg, cycleprev

# Переміщення на master
bind = SUPER+SHIFT, Return, layoutmsg, swapwithmaster master

# Свопування сусідніх вікон
bind = Super, J, layoutmsg, swapnext
bind = Super, K, layoutmsg, swapprev

# Додання/видалення master窗口
bind = Super, I, layoutmsg, addmaster
bind = Super, U, layoutmsg, removemaster

# Зміна співвідношення split (width/height)
binde = Super, Minus,      layoutmsg, mfact -0.05
binde = Super, Equal,      layoutmsg, mfact +0.05
binde = Super, Semicolon,  layoutmsg, mfact -0.05
binde = Super, Apostrophe, layoutmsg, mfact +0.05

binde = SUPER+SHIFT, H, layoutmsg, mfact -0.05
binde = SUPER+SHIFT, L, layoutmsg, mfact +0.05

# Обертання split
bind = SHIFT+Super, F, layoutmsg, rotatesplit

# Зміна орієнтації (top/left)
bind = SUPER+SHIFT, O, layoutmsg, orientationcycle top left


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙСИ - ПЕРЕКЛЮЧЕННЯ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Воркспейс 1 (Master) - Браузери
bind = Super, 1, exec, hyprctl keyword general:layout master && hyprctl dispatch workspace 1

# Воркспейси 2-5 (Dwindle) - Основна робота
bind = Super, 2, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 2
bind = Super, 3, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 3
bind = Super, 4, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 4
bind = Super, 5, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 5

# Воркспейс 6 (Master) - Комунікація/Допоміжне
bind = Super, 6, exec, hyprctl keyword general:layout master && hyprctl dispatch workspace 6

# Воркспейси 7-10 (Dwindle) - Розробка/Інше
bind = Super, 7, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 7
bind = Super, 8, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 8
bind = Super, 9, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 9
bind = Super, 0, exec, hyprctl keyword general:layout dwindle && hyprctl dispatch workspace 10

# Колесо миші для циклювання воркспейсів
bind = SUPER, mouse_up,   workspace, m+1
bind = SUPER, mouse_down, workspace, m-1

# Стрілки для циклювання воркспейсів
bind = SUPER, Right, workspace, m+1
bind = SUPER, Left,  workspace, m-1


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВІКНА - ПЕРЕМІЩЕННЯ НА ІНШИЙ ВОРКСПЕЙС
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

bind = SUPER+SHIFT, 1, movetoworkspace, 1
bind = SUPER+SHIFT, 2, movetoworkspace, 2
bind = SUPER+SHIFT, 3, movetoworkspace, 3
bind = SUPER+SHIFT, 4, movetoworkspace, 4
bind = SUPER+SHIFT, 5, movetoworkspace, 5
bind = SUPER+SHIFT, 6, movetoworkspace, 6
bind = SUPER+SHIFT, 7, movetoworkspace, 7
bind = SUPER+SHIFT, 8, movetoworkspace, 8
bind = SUPER+SHIFT, 9, movetoworkspace, 9
bind = SUPER+SHIFT, 0, movetoworkspace, 10

# Переміщення на сусідній воркспейс (не змінюючи фокус)
bind = CTRL+SUPER+SHIFT, Right, movetoworkspace, r+1
bind = CTRL+SUPER+SHIFT, Left,  movetoworkspace, r-1

# Переміщення мишею на сусідній воркспейс
bind = SUPER+ALT, mouse:273, movetoworkspace, r+1    # ПКМ
bind = SUPER+ALT, mouse:272, movetoworkspace, r-1    # ЛКМ


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙСИ - СПЕЦІАЛЬНІ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Toggle спеціального воркспейсу (dropdown/scratchpad)
bind = SUPER+SHIFT, S, togglespecialworkspace
bindc = SUPER, mouse:274, togglespecialworkspace

# Переміщення на спеціальний воркспейс
bind = SUPER+SHIFT, Up,   movetoworkspacesilent, special
bind = SUPER+SHIFT, Down, movetoworkspacesilent, e+0


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► МЕДІА
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Play/Pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# Назад/Вперед
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# Клавішні скорочення
bindl = SUPER+SHIFT, B, exec, playerctl previous
bindl = SUPER+SHIFT, N, exec, playerctl next

# Мишею (Super+Shift+Alt)
bind = SUPER+SHIFT+Alt, mouse:275, exec, playerctl previous
bind = SUPER+SHIFT+Alt, mouse:276, exec, playerctl next


