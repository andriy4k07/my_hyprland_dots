# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║               HYPRLAND WINDOW RULES & LAYER RULES                         ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

# ПРИМІТКА: hyprctl clients - щоб дізнатися клас додатку

#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► МОНІТОРИ ТА ВОРКСПЕЙСИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1, default:true
workspace = 6, monitor:HDMI-A-1, default:true


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ЗАГАЛЬНА ПРОЗОРІСТЬ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Легка прозорість для більшості додатків
windowrule {
  name = general-opacity
  opacity = 0.89 override 0.89 override
  match:class = .*
}

# Більша прозорість для терміналу
windowrule {
  name = terminal-opacity
  opacity = 0.6 0.5
  match:class = ^(kitty)$
}

# Повна непрозорість для графічних редакторів
windowrule {
  name = graphics-opacity
  opacity = 1.0 1.0
  match:class = ^(com\.obsproject\.Studio|krita|gimp)$
}

# Вимкнення blur для XWayland (для продуктивності)
windowrule {
  name = no-blur-xwayland
  no_blur = on
  match:xwayland = 1
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 1 - БРАУЗЕРИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Вимкнення автоматичної зміни розміру для браузерів
windowrule {
  name = browsers-no-auto-resize
  suppress_event = maximize fullscreen
  match:class = ^([Bb]rave-browser|firefox|chromium)$
}

# Присвоєння браузерів до воркспейсу 1
windowrule {
  name = browsers-workspace-1
  workspace = 1
  tile = on
  match:class = ^([Bb]rave-browser|[Bb]rave|firefox|Firefox|firefox-esr|firefoxdeveloperedition|chromium|Chromium|[Gg]oogle-chrome|[Mm]ozilla)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 2 - КОМУНІКАЦІЯ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Telegram (ліва панель)
windowrule {
  name = telegram-panel
  opacity = 0.8 0.7
  float = on
  size = (monitor_w*0.33) (monitor_h*0.93)
  move = ((monitor_w*0.01)) ((monitor_h*0.06))
  workspace = 2
  match:class = ^(org.telegram.desktop)$
}

# Discord та Signal (права панель)
windowrule {
  name = discord-signal-panel
  float = on
  size = (monitor_w*0.63) (monitor_h*0.93)
  move = ((monitor_w*0.35)) ((monitor_h*0.06))
  workspace = 2
  match:class = ^(discord|com\.discordapp\.Discord|[Ss]ignal|vesktop)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 3-5 (РОБОЧА ПЛОЩА)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Obsidian на воркспейсі 5
windowrule {
  name = obsidian-workspace-5
  workspace = 5
  match:class = ^(obsidian)$
}

# Electron додатки (Figma, Slack, тощо) - float по центру
windowrule {
  name = electron-float-center
  float = on
  size = (monitor_w*0.5)
  center = on
  match:class = ^(electron)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 6 - РОЗРОБКА
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# IDE (CLion, PyCharm, Rider, IDEA, WebStorm, DataGrip)
windowrule {
  name = jetbrains-ide-workspace-6
  workspace = 6
  match:class = ^(jetbrains-clion|jetbrains-pycharm|jetbrains-idea|jetbrains-rider|jetbrains-webstorm|jetbrains-datagrip)$
}

# IDE Update діалоги - float
windowrule {
  name = jetbrains-update-dialog
  float = on
  match:title = ^Update$
  match:class = .*updater.*
}

# IDE Service вікна без фокусу (float)
windowrule {
  name = jetbrains-service-windows
  no_initial_focus = on
  match:class = ^jetbrains-.*$
  match:float = 1
  match:title = ^$|^\s$|^win\d+$
}

# Postman на воркспейсі 6
windowrule {
  name = postman-workspace-6
  workspace = 6
  match:class = [Pp]ostman
}

# Virt-Manager (KVM/QEMU)
windowrule {
  name = virt-manager-float
  float = on
  workspace = 6
  match:class = ^(virt-manager)$
}

windowrule {
  name = virt-manager-window-layout
  size = (monitor_w*0.33) (monitor_h*0.93)
  move = ((monitor_w*0.65)) ((monitor_h*0.06))
  match:title = ^(Virtual Machine Manager)$
}

# QEMU/KVM VM вікна
windowrule {
  name = qemu-vm-window
  float = on
  size = (monitor_w*0.63) (monitor_h*0.93)
  move = ((monitor_w*0.01)) ((monitor_h*0.06))
  match:title = ^(.* on QEMU/KVM)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 7 - ІГРИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ігри та розваги
windowrule {
  name = games-workspace-7
  workspace = 7
  match:class = ^(net.lutris.Lutris|steam|Steam Settings|Налаштування Steam|steam_app.*|by-gdev-Main|org-tlauncher-tlauncher-rmo-TLauncher|Minecraft.*|Spotify)$
}

# Immediate tearing для .exe файлів (для гейм-дев)
windowrule {
  name = games-exe-tearing
  immediate = on
  match:title = ^(.*\.exe|Minecraft.*)$
}

# Steam додатки - immediate tearing
windowrule {
  name = steam-app-tearing
  immediate = on
  match:class = ^steam_app.*
}

# Confinement pointer для Steam ігор (мишка не виходить з вікна)
windowrule {
  name = steam-app-confine-pointer
  confine_pointer = on
  match:class = ^steam_app.*
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ВОРКСПЕЙС 9 - ПРИВАТНІСТЬ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Mullvad Browser
windowrule {
  name = mullvad-browser-workspace-9
  workspace = 9
  match:class = ^(Mullvad Browser)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► FLOAT ВІКНА - ЗАГАЛЬНЕ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Анімація для float вікон
windowrule {
  name = float-animation
  animation = popin
  match:float = 1
}

# Зелена рамка для float вікон
windowrule {
  name = float-border-green
  border_color = rgb(6ecf9f) rgb(1a7a4a) 45deg
  match:float = 1
}

# Діалоги Open/Save - по центру з half розміром
windowrule {
  name = dialog-open-save
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  center = on
  match:title = .*\b([Oo]pen|[Ss]ave)\b.*
}

# Немо з Waybar (custom window)
windowrule {
  name = nemo-float-panel
  float = on
  size = (monitor_w*0.48) (monitor_h*0.48)
  move = ((monitor_w*0.006)) ((monitor_h*0.06))
  match:class = ^(nemo-float)$
}

# Kitty float для Waybar
windowrule {
  name = kitty-float-panel
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  move = ((monitor_w*0.25)) ((monitor_h*0.06))
  match:title = ^(kitty-float)$
}

# Немо Downloads панель
windowrule {
  name = nemo-downloads-panel
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  move = ((monitor_w*0.25)) ((monitor_h*0.06))
  match:class = ^(nemo)$
  match:title = ^Downloads$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ПАНЕЛІ ДОДАТКІВ (WAYBAR)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# EasyEffects (верхній правий кут)
windowrule {
  name = easyeffects-panel
  float = on
  pin = on
  size = (monitor_w*0.4) (monitor_h*0.4)
  move = ((monitor_w*0.57)) ((monitor_h*0.06))
  match:class = ^(com.github.wwmm.easyeffects)$
}

# Nextcloud (верхній право)
windowrule {
  name = nextcloud-panel
  float = on
  size = (monitor_w*0.2) (monitor_h*0.5)
  move = ((monitor_w*0.6)) ((monitor_h*0.06))
  match:class = ^(com.nextcloud.desktopclient.nextcloud)$
}

# Proton Pass (менеджер паролів)
windowrule {
  name = proton-pass-panel
  float = on
  size = (monitor_w*0.4) (monitor_h*0.4)
  move = ((monitor_w*0.56)) ((monitor_h*0.18))
  match:class = ^(Proton Pass)$
}

# Proton VPN
windowrule {
  name = proton-vpn-panel
  float = on
  size = (monitor_w*0.4) (monitor_h*0.4)
  move = ((monitor_w*0.53)) ((monitor_h*0.14))
  match:class = ^(protonvpn-app)$
}

# Authenticator та Blueman (Bluetooth)
windowrule {
  name = authenticator-blueman-float
  float = on
  size = (monitor_w*0.4) (monitor_h*0.4)
  center = on
  match:class = ^(proton-authenticator|blueman-manager)$
}

# Простіші float додатки
windowrule {
  name = simple-float-apps
  float = on
  match:class = ^(viewnior|xdg-desktop-portal-gtk)$
}

# Hyprland Share Picker (мала панель)
windowrule {
  name = share-picker-float
  float = on
  size = (monitor_w*0.2) (monitor_h*0.2)
  match:class = ^(hyprland-share-picker)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► MEDIA - PICTURE-IN-PICTURE
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# PIP (YouTube, Google Meet)
windowrule {
  name = picture-in-picture
  float = on
  keep_aspect_ratio = on
  move = ((monitor_w*0.74)) ((monitor_h*0.06))
  size = (monitor_w*0.25) (monitor_h*0.25)
  pin = on
  idle_inhibit = focus
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
}

# MPV та VLC (idle inhibit на фокусі)
windowrule {
  name = media-player-idle-inhibit
  idle_inhibit = focus
  match:class = ^(mpv|vlc)$
}

# Google Meet sharing notification (pin)
windowrule {
  name = google-meet-sharing
  float = on
  pin = on
  move = ((monitor_w*0.37)) ((monitor_h*-0.1))
  match:title = ^(meet.google.com is sharing a window.)$
}

# TikTok мінівідео (нижній правий кут)
windowrule {
  name = tiktok-mini
  float = on
  keep_aspect_ratio = on
  move = ((monitor_w*0.79)) ((monitor_h*0.35))
  size = (monitor_w*0.2) (monitor_h*0.63)
  pin = on
  match:title = ^(TikTok - Make Your Day)(.*)$
}

# Zoom sharing (pin у правому верхньому кутку)
windowrule {
  name = zoom-sharing
  float = on
  keep_aspect_ratio = on
  move = ((monitor_w*0.74)) ((monitor_h*0.06))
  pin = on
  idle_inhibit = focus
  match:title = ^(app.zoom.us is sharing your screen.*)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► ДІАЛОГОВІ ВІКНА
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Стандартні діалоги - по центру
windowrule {
  name = standard-dialogs
  center = on
  float = on
  match:title = ^(Open File|Open Files|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload|Custom application|Untitled|Select the extension directory.)(.*)$
}

# Properties/Налаштування
windowrule {
  name = properties-dialogs
  center = on
  float = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  match:title = ^(.*Properties.*)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► TILING ВІКНА
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Warp terminal - tiling
windowrule {
  name = warp-terminal-tile
  tile = on
  match:class = ^dev\.warp\.Warp$
}

# Без тіней для tiled вікон (більша продуктивність)
windowrule {
  name = tiled-no-shadow
  no_shadow = on
  match:float = 0
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► СПЕЦІАЛЬНІ ВОРКСПЕЙСИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

workspace = special:sys, gapsout:10


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► LAYER RULES - GTK LAYER SHELL
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# X-ray ефект для всіх layers
layerrule {
  name = layer-xray
  xray = 1
  match:namespace = .*
}

# GTK Layer Shell (Nautilus, Nemo sidebars тощо)
layerrule {
  name = gtk-layer-shell-blur
  blur = on
  ignore_alpha = 0
  match:namespace = ^(gtk-layer-shell)$
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► LAYER RULES - МЕНЮ ТА ЛАУНЧЕРИ
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Rofi Launcher
layerrule {
  name = launcher-blur
  blur = on
  ignore_alpha = 0.5
  match:namespace = launcher
}

# Notifications
layerrule {
  name = notifications-blur
  blur = on
  ignore_alpha = 0.69
  match:namespace = notifications
}

# Logout dialog
layerrule {
  name = logout-blur
  blur = on
  match:namespace = logout_dialog
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► LAYER RULES - БЕЗ АНІМАЦІЙ (ПРОДУКТИВНІСТЬ)
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Wofi (альтернативний лаунчер)
layerrule {
  name = wofi-no-anim
  no_anim = on
  match:namespace = wofi
}

# Selection (drag-to-select)
layerrule {
  name = selection-no-anim
  no_anim = on
  match:namespace = selection
}

# Overview/Expo
layerrule {
  name = overview-no-anim
  no_anim = on
  match:namespace = overview
}

# Anyrun (альтернативний лаунчер)
layerrule {
  name = anyrun-no-anim
  no_anim = on
  match:namespace = anyrun
}

# Індикатори (volume, brightness, тощо)
layerrule {
  name = indicator-no-anim
  no_anim = on
  match:namespace = indicator.*
}

# On-Screen Keyboard
layerrule {
  name = osk-no-anim
  no_anim = on
  match:namespace = osk
}

# Color Picker (Hyprpicker)
layerrule {
  name = hyprpicker-no-anim
  no_anim = on
  match:namespace = hyprpicker
}


#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ► REFERENCIAS ТА TIPS
#━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Дізнатися клас/назву вікна:
#   hyprctl clients           # список усіх вікон з їх классами
#   hyprctl activewindow     # інформація про активне вікно
#
# Помірні точки координат:
#   monitor_w * 0.5 = половина ширини
#   monitor_h * 0.06 = відступ від верхнього краю (60px на 1080p)
#   move = ((monitor_w*0.25)) ((monitor_h*0.06)) = центр по ширині, 60px від верху
#
# Часті match параметри:
#   match:class = ^(app-name)$          # точне збігання класу
#   match:title = .*pattern.*           # regex для заголовку
#   match:float = 1                     # тільки float вікна
#   match:xwayland = 1                  # тільки XWayland
